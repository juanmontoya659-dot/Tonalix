
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:3000

    container_name: tonalix-app-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    networks:
      - tonalix-app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: tonalix-app-backend

    ports:
      - "3000:3000"

    env_file:
      - ./backend/.env

    environment:
      AUDIO_ENGINE_URL: http://audio-engine:8000

    depends_on:
      - audio-engine

    networks:
      - tonalix-app

    volumes:
      - backend-uploads:/app/uploads

  audio-engine:
    build:
      context: ./audio-engine
      dockerfile: Dockerfile

    container_name: tonalix-app-audio-engine

    networks:
      - tonalix-app

    volumes:
      - processed-audio:/app/processed
      - temp-audio:/app/temp

networks:
  tonalix-app:
    driver: bridge

volumes:
  backend-uploads:
  processed-audio:
  temp-audio:
